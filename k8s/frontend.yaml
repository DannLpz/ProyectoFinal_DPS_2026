# ==========================================
# Frontend - Deployment
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: looka
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: projectov3-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
# ==========================================
# Frontend - Service (NodePort para acceso externo)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: looka
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30083
  type: NodePort