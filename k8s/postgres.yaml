# ==========================================
# PostgreSQL - PersistentVolumeClaim
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: looka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ==========================================
# PostgreSQL - Deployment
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: looka
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: looka_user
            - name: POSTGRES_PASSWORD
              value: looka_password
            - name: POSTGRES_DB
              value: looka_db
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# ==========================================
# PostgreSQL - Service (ClusterIP, interno)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: looka
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP